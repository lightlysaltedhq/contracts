name: CI

# Every action is pinned to a commit, not a tag, with the release it resolved from beside it: the
# same SHAs as release-foundations.yml, carried over from lightlysaltedhq/design-system where they
# were verified on 25/09/2026. `npm run verify:actions-pinned` fails any `uses:` that is not.
#
# PYTHONDONTWRITEBYTECODE: Python invalidates a .pyc on (mtime, size), and a one-character edit that
# changes neither can leave `import` returning a module that does not match the file on disk.

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

jobs:
  foundations:
    name: design-foundations — the contract's own gates and its tarball
    runs-on: ubuntu-latest
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'

      # Installed first: the gate scripts' tests run the Salt contract gate, which imports ajv. No
      # install scripts: nothing here needs one.
      - name: Install the pinned tools
        run: npm ci --ignore-scripts
      - name: The repository's own gate scripts fail when they should
        run: npm run test:scripts
      - name: Every action is pinned to a commit
        run: npm run verify:actions-pinned

      # audit_vectors · check_derivation · check_no_colours · check_prose_lengths · the oklch
      # self-test · contrast_rules · selftest_emit · check_scale_shape · check_type_scale ·
      # check_layout_roles. check_no_colours is scoped to foundations/ by construction: its ROOT is
      # the parent of its own scripts/ directory.
      - name: Vectors, derivation, zero colours, the emitter's own guards
        run: npm run foundations

      - name: The foundations tarball ships the contract and nothing else
        run: npm run verify:foundations-pack
      - name: ./type-tokens and ./layout-roles bundle for a neutral platform
        run: npm run verify:type-tokens-bundle

  salt-contract:
    name: salt-contract — one version, valid against its schemas, no colours, its tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.23.3'
      - name: Install the pinned tools
        run: npm ci --ignore-scripts
      - name: The Salt contract's own gate
        run: npm run salt-contract
      - name: The shared stylesheets' gate
        run: npm run salt-stylesheets
