<div class="salt-section" id="gallery-label" data-tone="surface" data-tone-dark="surface" data-spacing="md" data-width="default" data-track="gallery-3" style="--salt-section-space: var(--space-section-md)">
  <div class="salt-section__content">
    <div class="salt-block" data-block="gallery">
      <div class="salt-carousel" role="region" aria-roledescription="carousel" aria-label="Garden photographs">
        <ul class="salt-carousel__track" role="list" tabindex="0">
          <li class="salt-carousel__slide">
            <div class="salt-carousel__slide-inner" role="group" aria-roledescription="slide" aria-label="Slide 1 of 3">
              <figure class="salt-gallery__figure">
                <img class="salt-gallery__image" src="https://uploads.example/courtyard-1600.jpg" srcset="https://uploads.example/courtyard-640.jpg 640w, https://uploads.example/courtyard-1024.jpg 1024w, https://uploads.example/courtyard-1600.jpg 1600w" sizes="(min-width: 64rem) 40rem, 80vw" width="1600" height="1200" alt="A paved courtyard with olive trees in pots" loading="lazy" decoding="async">
                <figcaption class="salt-gallery__caption">Olive trees in a paved courtyard</figcaption>
              </figure>
            </div>
          </li>
          <li class="salt-carousel__slide">
            <div class="salt-carousel__slide-inner" role="group" aria-roledescription="slide" aria-label="Slide 2 of 3">
              <figure class="salt-gallery__figure">
                <img class="salt-gallery__image" src="https://uploads.example/orchard-1600.jpg" srcset="https://uploads.example/orchard-640.jpg 640w, https://uploads.example/orchard-1024.jpg 1024w, https://uploads.example/orchard-1600.jpg 1600w" sizes="(min-width: 64rem) 40rem, 80vw" width="1600" height="1200" alt="Young apple trees in a small orchard" loading="lazy" decoding="async">
                <figcaption class="salt-gallery__caption">A new orchard in its first spring</figcaption>
              </figure>
            </div>
          </li>
          <li class="salt-carousel__slide">
            <div class="salt-carousel__slide-inner" role="group" aria-roledescription="slide" aria-label="Slide 3 of 3">
              <figure class="salt-gallery__figure">
                <img class="salt-gallery__image" src="https://uploads.example/pond-1600.jpg" srcset="https://uploads.example/pond-640.jpg 640w, https://uploads.example/pond-1024.jpg 1024w, https://uploads.example/pond-1600.jpg 1600w" sizes="(min-width: 64rem) 40rem, 80vw" width="1600" height="1000" alt="A wildlife pond edged with marsh marigolds" loading="lazy" decoding="async">
                <figcaption class="salt-gallery__caption">The finished wildlife pond</figcaption>
              </figure>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
