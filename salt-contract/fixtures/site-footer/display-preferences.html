<footer class="salt-footer" data-tone="surface" data-tone-dark="surface">
  <div class="salt-footer__inner">
    <nav class="salt-footer__nav" aria-label="Footer">
      <div class="salt-footer__column">
        <ul class="salt-footer__links" role="list">
          <li>
            <a class="salt-footer__link" href="/contact/">Contact</a>
          </li>
          <li>
            <a class="salt-footer__link" href="/accessibility/">Accessibility</a>
          </li>
        </ul>
      </div>
    </nav>
    <div class="salt-footer__base">
      <ul class="salt-footer__social" role="list" aria-label="Social media">
        <li>
          <a class="salt-footer__social-link" href="https://www.instagram.com/hartleygardens">
            <svg class="salt-icon" data-icon="instagram" data-size="md" viewBox="0 0 24 24" width="24" height="24" focusable="false" role="img" aria-label="Instagram" fill="none" stroke="currentColor"><path d="M0 0"></path></svg>
          </a>
        </li>
      </ul>
      <button class="salt-theme-toggle" type="button" aria-pressed="false" aria-label="Dark mode"></button>
      <div class="salt-display-preferences" hidden>
        <details class="salt-display-preferences__panel">
          <summary class="salt-display-preferences__summary">Display preferences</summary>
          <div class="salt-display-preferences__controls">
            <div class="salt-display-preferences__group" role="group" aria-label="Text size">
              <span class="salt-display-preferences__label" aria-hidden="true">Text size</span>
              <button type="button" data-salt-pref="scale" data-salt-action="decrease" aria-label="Smaller text">A-</button>
              <button type="button" data-salt-pref="scale" data-salt-action="reset" aria-label="Reset text size">A</button>
              <button type="button" data-salt-pref="scale" data-salt-action="increase" aria-label="Larger text">A+</button>
            </div>
            <button type="button" aria-pressed="false" data-salt-pref="contrast">High contrast</button>
            <button type="button" aria-pressed="false" data-salt-pref="grayscale">Greyscale</button>
            <button type="button" aria-pressed="false" data-salt-pref="motion">Reduce motion</button>
          </div>
        </details>
      </div>
      <p class="salt-footer__copyright">© 2026 Hartley Gardens</p>
      <div class="salt-footer__consent">
        <button class="salt-button" type="button" data-style="secondary" data-salt-consent-preferences="">Cookie preferences</button>
        <p class="salt-sr-only" role="status" aria-live="polite"></p>
      </div>
    </div>
  </div>
</footer>
