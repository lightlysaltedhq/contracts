<footer class="salt-footer" data-tone="surface" data-tone-dark="surface">
  <div class="salt-footer__inner">
    <nav class="salt-footer__nav" aria-label="Footer">
      <div class="salt-footer__column">
        <ul class="salt-footer__links" role="list">
          <li>
            <a class="salt-footer__link" href="/contact/">Contact</a>
          </li>
          <li>
            <a class="salt-footer__link" href="/privacy/">Privacy policy</a>
          </li>
        </ul>
      </div>
    </nav>
    <div class="salt-footer__base">
      <p class="salt-footer__copyright">© 2026 Hartley Gardens</p>
      <div class="salt-footer__consent">
        <button class="salt-button" type="button" data-style="secondary" data-salt-consent-preferences="">Cookie preferences</button>
        <p class="salt-sr-only" role="status" aria-live="polite"></p>
        <dialog class="salt-consent-panel" aria-labelledby="site-footer__consent-title">
          <form>
            <h2 class="salt-consent-panel__title" id="site-footer__consent-title">Cookie preferences</h2>
            <div class="salt-consent-panel__category">
              <input class="salt-consent-panel__checkbox" type="checkbox" id="site-footer__consent-analytics" name="analytics" aria-describedby="site-footer__consent-analytics-description">
              <label for="site-footer__consent-analytics">Analytics</label>
              <div class="salt-consent-panel__description" id="site-footer__consent-analytics-description">Helps us see which pages are read, with no personal details.</div>
            </div>
            <div class="salt-consent-panel__category">
              <input class="salt-consent-panel__checkbox" type="checkbox" id="site-footer__consent-marketing" name="marketing" aria-describedby="site-footer__consent-marketing-description">
              <label for="site-footer__consent-marketing">Marketing</label>
              <div class="salt-consent-panel__description" id="site-footer__consent-marketing-description">Lets us measure how our adverts perform.</div>
            </div>
            <div class="salt-consent-panel__actions">
              <button class="salt-button" type="submit" data-style="primary">Save preferences</button>
              <button class="salt-button" type="button" data-style="secondary">Cancel</button>
            </div>
          </form>
        </dialog>
      </div>
    </div>
  </div>
</footer>
