<main id="main" tabindex="-1">
  <h1>Page not found</h1>

  <search class="salt-search" aria-label="Search the site">
    <form class="salt-search__form" action="/search/" method="get">
      <label class="salt-search__label" for="search-form__input">Search</label>
      <input class="salt-search__input" id="search-form__input" type="search" name="q" maxlength="100" enterkeyhint="search">

    </form>
  </search>
  <a href="/">Back to the home page</a>
</main>
