<section class="salt-section" id="kind-words-carousel" aria-labelledby="kind-words-carousel__heading" data-tone="brand-tint" data-tone-dark="brand-tint" data-spacing="md" data-width="default" data-track="carousel-5" style="--salt-section-space: var(--space-section-md)">
  <div class="salt-section__content">
    <div class="salt-block" data-block="carousel" data-source="testimonials">
      <h2 id="kind-words-carousel__heading">Kind words</h2>
      <div class="salt-carousel" role="region" aria-roledescription="carousel" aria-label="Kind words">
        <ul class="salt-carousel__track" role="list" tabindex="0">
          <li class="salt-carousel__slide">
            <div class="salt-carousel__slide-inner" role="group" aria-roledescription="slide" aria-label="Slide 1 of 3">
              <figure class="salt-card salt-showcase__quote">
                <p class="salt-showcase__rating" role="img" aria-label="Rated 5 of 5"><span class="salt-showcase__stars" aria-hidden="true" style="--salt-rating-fill: 100%">☆☆☆☆☆<span class="salt-showcase__stars-fill">★★★★★</span></span></p>
                <blockquote class="salt-showcase__text">
                  <p>They turned a patch of builders' rubble into a garden we use every evening.</p>
                </blockquote>
                <figcaption class="salt-showcase__caption">
                  <h3>Maya Okafor</h3>
                  <p class="salt-showcase__meta">Homeowner, Redland</p>
                </figcaption>
              </figure>
            </div>
          </li>
          <li class="salt-carousel__slide">
            <div class="salt-carousel__slide-inner" role="group" aria-roledescription="slide" aria-label="Slide 2 of 3">
              <figure class="salt-card salt-showcase__quote">
                <p class="salt-showcase__rating" role="img" aria-label="Rated 4 of 5"><span class="salt-showcase__stars" aria-hidden="true" style="--salt-rating-fill: 80%">☆☆☆☆☆<span class="salt-showcase__stars-fill">★★★★★</span></span></p>
                <blockquote class="salt-showcase__text">
                  <p>The terrace planting has had more compliments than the menu.</p>
                </blockquote>
                <figcaption class="salt-showcase__caption">
                  <h3>Tom Ashby</h3>
                  <p class="salt-showcase__meta">Manager, Ashby Mill Cafe</p>
                </figcaption>
              </figure>
            </div>
          </li>
          <li class="salt-carousel__slide">
            <div class="salt-carousel__slide-inner" role="group" aria-roledescription="slide" aria-label="Slide 3 of 3">
              <figure class="salt-card salt-showcase__quote">
                <blockquote class="salt-showcase__text">
                  <p>Reliable, tidy and good with volunteers of every age.</p>
                </blockquote>
                <figcaption class="salt-showcase__caption">
                  <h3>Priya Nair</h3>
                  <p class="salt-showcase__meta">Trustee, Greenway Allotments</p>
                </figcaption>
              </figure>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </div>
</section>
