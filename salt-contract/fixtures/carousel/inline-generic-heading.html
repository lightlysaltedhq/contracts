<section class="salt-section" id="recent-gardens" aria-labelledby="recent-gardens__heading" data-tone="surface" data-tone-dark="surface" data-spacing="md" data-width="default" data-track="carousel-1" style="--salt-section-space: var(--space-section-md)">
  <div class="salt-section__content">
    <div class="salt-block" data-block="carousel" data-source="inline">
      <h2 id="recent-gardens__heading">Recent gardens</h2>
      <div class="salt-carousel" role="region" aria-roledescription="carousel" aria-label="Recent gardens">
        <ul class="salt-carousel__track" role="list" tabindex="0">
          <li class="salt-carousel__slide">
            <div class="salt-carousel__slide-inner" role="group" aria-roledescription="slide" aria-label="Slide 1 of 3">
              <div class="salt-card">
                <div class="salt-showcase__media">
                  <img src="https://uploads.example/fern-bed-800.jpg" srcset="https://uploads.example/fern-bed-400.jpg 400w, https://uploads.example/fern-bed-800.jpg 800w" sizes="(min-width: 64rem) 22rem, (min-width: 40rem) 45vw, 100vw" width="800" height="600" alt="A shaded bed of ferns and hostas" loading="lazy" decoding="async">
                </div>
                <h3>Shaded courtyard</h3>
                <p class="salt-showcase__text">Ferns and hostas for a north-facing corner.</p>
              </div>
            </div>
          </li>
          <li class="salt-carousel__slide">
            <div class="salt-carousel__slide-inner" role="group" aria-roledescription="slide" aria-label="Slide 2 of 3">
              <div class="salt-card">
                <div class="salt-showcase__media">
                  <img src="https://uploads.example/gravel-garden-800.jpg" srcset="https://uploads.example/gravel-garden-400.jpg 400w, https://uploads.example/gravel-garden-800.jpg 800w" sizes="(min-width: 64rem) 22rem, (min-width: 40rem) 45vw, 100vw" width="800" height="600" alt="A gravel garden with grasses and sea holly" loading="lazy" decoding="async">
                </div>
                <h3>Coastal gravel garden</h3>
                <p class="salt-showcase__text">Tough planting that shrugs off salt wind.</p>
              </div>
            </div>
          </li>
          <li class="salt-carousel__slide">
            <div class="salt-carousel__slide-inner" role="group" aria-roledescription="slide" aria-label="Slide 3 of 3">
              <div class="salt-card">
                <div class="salt-showcase__media">
                  <img src="https://uploads.example/kitchen-plot-800.jpg" srcset="https://uploads.example/kitchen-plot-400.jpg 400w, https://uploads.example/kitchen-plot-800.jpg 800w" sizes="(min-width: 64rem) 22rem, (min-width: 40rem) 45vw, 100vw" width="800" height="600" alt="Raised vegetable beds beside a kitchen door" loading="lazy" decoding="async">
                </div>
                <h3>Kitchen plot</h3>
                <p class="salt-showcase__text">Raised beds sized for a family table.</p>
              </div>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </div>
</section>
