<div class="salt-section" id="client-quotes" data-tone="surface-inverse" data-tone-dark="surface-inverse" data-spacing="md" data-width="default" data-track="carousel-2" style="--salt-section-space: var(--space-section-md)">
  <div class="salt-section__content">
    <div class="salt-block" data-block="carousel" data-source="inline">
      <div class="salt-carousel" role="region" aria-roledescription="carousel" aria-label="Client quotes">
        <ul class="salt-carousel__track" role="list" tabindex="0">
          <li class="salt-carousel__slide">
            <div class="salt-carousel__slide-inner" role="group" aria-roledescription="slide" aria-label="Slide 1 of 3">
              <figure class="salt-card salt-showcase__quote">
                <blockquote class="salt-showcase__text">
                  <p>Our customers now ask to sit in the garden before the dining room.</p>
                </blockquote>
                <figcaption class="salt-showcase__caption">
                  <div class="salt-showcase__media">
                    <img src="https://uploads.example/portrait-ines-192.jpg" srcset="https://uploads.example/portrait-ines-96.jpg 96w, https://uploads.example/portrait-ines-192.jpg 192w" sizes="4rem" width="192" height="192" alt="" loading="lazy" decoding="async">
                  </div>
                  <h3>Ines Carvalho</h3>
                  <p class="salt-showcase__meta">Owner, The Walled Garden Cafe</p>
                </figcaption>
              </figure>
            </div>
          </li>
          <li class="salt-carousel__slide">
            <div class="salt-carousel__slide-inner" role="group" aria-roledescription="slide" aria-label="Slide 2 of 3">
              <figure class="salt-card salt-showcase__quote">
                <blockquote class="salt-showcase__text">
                  <p>Three visits in and the borders have never looked better.</p>
                </blockquote>
                <figcaption class="salt-showcase__caption">
                  <h3>Callum Reed</h3>
                  <p class="salt-showcase__meta">Homeowner, Totterdown</p>
                </figcaption>
              </figure>
            </div>
          </li>
          <li class="salt-carousel__slide">
            <div class="salt-carousel__slide-inner" role="group" aria-roledescription="slide" aria-label="Slide 3 of 3">
              <figure class="salt-card salt-showcase__quote">
                <blockquote class="salt-showcase__text">
                  <p>The children helped plant the beds and now tend them every week.</p>
                </blockquote>
                <figcaption class="salt-showcase__caption">
                  <h3>Hannah Moyo</h3>
                  <p class="salt-showcase__meta">Head, Oakfield Primary</p>
                </figcaption>
              </figure>
            </div>
          </li>
        </ul>
      </div>
    </div>
  </div>
</div>
