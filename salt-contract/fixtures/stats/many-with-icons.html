<section class="salt-section" id="stats-many" aria-labelledby="stats-many__heading" data-tone="surface" data-tone-dark="surface" data-spacing="md" data-width="default" data-track="stats-1" style="--salt-section-space: var(--space-section-md)">
  <div class="salt-section__content">
    <div class="salt-block" data-block="stats">
      <h2 id="stats-many__heading">Lightly Salted in numbers</h2>
      <p class="salt-intro">A few figures from the last five years.</p>
      <ul class="salt-grid" role="list" data-columns="3">
        <li class="salt-stat">
          <svg class="salt-icon" data-icon="check" data-size="lg" viewBox="0 0 24 24" width="24" height="24" focusable="false" aria-hidden="true" fill="none" stroke="currentColor"><path d="M0 0"></path></svg>
          <p class="salt-stat__value">250<span class="salt-stat__suffix">+</span></p>
          <p class="salt-stat__label">Sites launched</p>
        </li>
        <li class="salt-stat">
          <svg class="salt-icon" data-icon="star" data-size="lg" viewBox="0 0 24 24" width="24" height="24" focusable="false" aria-hidden="true" fill="none" stroke="currentColor"><path d="M0 0"></path></svg>
          <p class="salt-stat__value">4.9</p>
          <p class="salt-stat__label">Average review score</p>
        </li>
        <li class="salt-stat">
          <svg class="salt-icon" data-icon="clock" data-size="lg" viewBox="0 0 24 24" width="24" height="24" focusable="false" aria-hidden="true" fill="none" stroke="currentColor"><path d="M0 0"></path></svg>
          <p class="salt-stat__value">24<span class="salt-stat__suffix">h</span></p>
        </li>
      </ul>
    </div>
  </div>
</section>
